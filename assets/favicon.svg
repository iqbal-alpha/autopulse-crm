<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ap-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="ap-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="ap-pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="ap-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#06B6D4" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background Container -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#ap-bg)" stroke="url(#ap-border)" stroke-width="2"/>
  <!-- Subtle Internal Dial Circle -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="#1E293B" stroke-width="1.2" stroke-dasharray="3 3"/>
  <!-- Iconic AutoPulse Waveform -->
  <path d="M 10 32 L 20 32 L 28 14 L 38 50 L 46 22 L 50 32 L 54 32"
        fill="none"
        stroke="url(#ap-pulse)"
        stroke-width="4.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#ap-glow)"/>
</svg>
